# Meditation Copilot — events API on Cloudflare Workers + D1
# Setup steps: docs/setup-cloudflare.md · Environments: local (npm run dev), test (--env test), prod (default)
name = "meditation-copilot-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://sosmn.org,https://www.sosmn.org,https://admin.sosmn.org,http://localhost:8000,http://localhost:8001"
GOOGLE_CLIENT_ID = "108186102394-sv306m8272h9p5eo4r5fvtolfgut3b09.apps.googleusercontent.com"
MS_CLIENT_ID = "cc706be3-4021-4460-9705-95d4cd0c00d0"
# Secrets (NOT in this file):  npx wrangler secret put SESSION_SECRET
#                              npx wrangler secret put ADMIN_EMAILS

[[d1_databases]]
binding = "DB"
database_name = "meditation-copilot"
database_id = "06f08984-06fa-49cf-9277-88dc293f584f"

[observability]
enabled = true

# ---------- TEST: https://meditation-copilot-api-test.aknaik.workers.dev ----------
# One-time set-up (see docs/DEV-PROCESS.md → "Test environment"):
#   npx wrangler d1 create meditation-copilot-test       → paste the database_id below
#   npx wrangler secret put SESSION_SECRET --env test     (a different random value from prod)
#   npx wrangler secret put ADMIN_EMAILS --env test
[env.test]
name = "meditation-copilot-api-test"
[env.test.vars]
ALLOWED_ORIGINS = "https://test.sosmn.org,https://test-admin.sosmn.org,http://localhost:8000,http://localhost:8001"
GOOGLE_CLIENT_ID = "108186102394-sv306m8272h9p5eo4r5fvtolfgut3b09.apps.googleusercontent.com"
MS_CLIENT_ID = "cc706be3-4021-4460-9705-95d4cd0c00d0"
[[env.test.d1_databases]]
binding = "DB"
database_name = "meditation-copilot-test"
database_id = "REPLACE-WITH-TEST-DATABASE-ID"
[env.test.observability]
enabled = true
